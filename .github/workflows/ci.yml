name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_FFMPEG_TESTS: "1"
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      STORAGE_DRIVER: local
      BLOB_READ_WRITE_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test (including real ffmpeg regressions)
        run: npm test

      - name: Multipart regressions with the bundled encoder
        env:
          FFMPEG_PATH: ""
        run: npx vitest run lib/renderClip.boundaries.regression.test.ts

      - name: Contain audio regressions with the bundled encoder and probe
        env:
          FFMPEG_PATH: ""
          FFPROBE_PATH: ""
        run: npx vitest run lib/containAudioRepair.regression.test.ts

      - name: Clip audio regressions with the bundled encoder and probe
        env:
          FFMPEG_PATH: ""
          FFPROBE_PATH: ""
        run: npx vitest run lib/clipAudio.regression.test.ts

      - name: Divergent AV clock regressions with the bundled encoder and probe
        env:
          FFMPEG_PATH: ""
          FFPROBE_PATH: ""
        run: npx vitest run lib/sourceAvClock.regression.test.ts

      - name: Audio fade regressions with the bundled encoder and probe
        env:
          FFMPEG_PATH: ""
          FFPROBE_PATH: ""
        run: npx vitest run lib/audioFadeExport.regression.test.ts

      - name: Title regressions with the bundled encoder and probe
        env:
          FFMPEG_PATH: ""
          FFPROBE_PATH: ""
        run: npx vitest run lib/titleComposition.regression.test.ts lib/titleRenderer.regression.test.ts lib/titleRenderer.initialization.test.ts

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run test:typecheck

      - name: Production browser regressions
        run: npm run test:browser

      - name: Audit (high and above)
        run: npm audit --audit-level=high

      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
